# release.yml — tag v* 触发的验证性构建
#
# 作用: 在干净的 Ubuntu 上验证本仓库可复现构建 (Qt6 + carmeter + kernel + uboot),
#       产物上传为 GitHub Actions artifact.
# 注意: 本 CI 不做 buildroot 全量 rootfs 构建 (数小时, 依赖本地 fakeroot 补丁),
#       完整 release/ 镜像 (rootfs.ext4) 需本地 `make release` 生成.
#
# 缓存:
#   - /opt/qt6-carmeter + /opt/qt6-carmeter-host: Qt6 编译产物 (key 含 Qt6 源码 hash)
#   - ~/qt6-cache/qt-everywhere-src-6.7.3: Qt6 源码 (git-lfs 之外的大文件, 避免反复下载)

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # 必须 22.04: Ubuntu 24.04 (noble) 起官方源不再发布 armhf 包,
    # libgpiod-dev:armhf 等交叉依赖只能从 jammy 安装
    runs-on: ubuntu-22.04
    # 8h 给全量首跑: Qt6 host (1h) + Qt6 target (2h) + carmeter + kernel + uboot + 收尾
    # 缓存命中后只需 15-20 分钟
    timeout-minutes: 480
    env:
      QT6_PREFIX: /opt/qt6-carmeter
      QT_HOST: /opt/qt6-carmeter-host
      CARMETER_STAGING: ${{ github.workspace }}/staging
      QT_SRC: ${{ github.workspace }}/qt6-src/qt-everywhere-src-6.7.3
      QT_BUILD: ${{ github.workspace }}/qt6-build
      CARMETER_BUILD: ${{ github.workspace }}/carmeter-build
      JOBS: 4
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉工具链与依赖
        run: |
          sudo apt-get update
          sudo dpkg --add-architecture armhf
          # 默认源 (archive/security) 没有 armhf 目录, 不限制架构的话 apt update
          # 会对它们也拉 armhf Packages → 404. 限制默认源仅服务 amd64.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^URIs:/Architectures: amd64\nURIs:/' /etc/apt/sources.list.d/ubuntu.sources
          else
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
          # armhf 二进制包托管在 ports.ubuntu.com
          echo "deb [arch=armhf] https://ports.ubuntu.com/ubuntu-ports jammy main universe multiverse restricted" | sudo tee /etc/apt/sources.list.d/armhf.list
          echo "deb [arch=armhf] https://ports.ubuntu.com/ubuntu-ports jammy-updates main universe multiverse restricted" | sudo tee -a /etc/apt/sources.list.d/armhf.list
          echo "deb [arch=armhf] https://ports.ubuntu.com/ubuntu-ports jammy-security main universe multiverse restricted" | sudo tee -a /etc/apt/sources.list.d/armhf.list
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            libc6-armhf-cross libc6-dev-armhf-cross \
            ninja-build cmake pkg-config bc u-boot-tools \
            libgpiod-dev:armhf \
            libssl-dev flex bison \
            zlib1g-dev libpcre2-dev libfreetype-dev \
            lzop
          arm-linux-gnueabihf-g++ -dumpversion

      - name: 恢复 Qt6 源码缓存
        id: qt-src-cache
        uses: actions/cache@v5
        with:
          path: qt6-src
          key: qt6-src-6.7.3

      - name: 下载 Qt6 源码
        if: steps.qt-src-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p qt6-src
          curl -fsSL -o /tmp/qt.tar.xz \
            https://download.qt.io/archive/qt/6.7/6.7.3/single/qt-everywhere-src-6.7.3.tar.xz
          tar xJf /tmp/qt.tar.xz -C qt6-src
          rm /tmp/qt.tar.xz

      - name: 恢复 Qt6 编译产物缓存
        id: qt6-cache
        uses: actions/cache@v5
        with:
          path: |
            /opt/qt6-carmeter
            /opt/qt6-carmeter-host
          key: qt6-${{ hashFiles('qt6/build-qt6.sh', 'qt6/qt6-toolchain.cmake') }}-6.7.3

      - name: 编译 host Qt (QT_HOST_PATH 必需, 供 qmake/qmlcachegen 等交叉编译工具)
        if: steps.qt6-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "$QT_SRC" -B qt6-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$QT_HOST" \
            -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF \
            -DQT_BUILD_SUBMODULES="qtbase;qtshadertools;qtdeclarative" \
            -DBUILD_SHARED_LIBS=ON -DCMAKE_CXX_STANDARD=17 \
            -DINPUT_accessibility=no -DINPUT_testlib=no \
            -DINPUT_opengl=no -DINPUT_opengles2=no -DINPUT_opengles3=no \
            -DINPUT_egl=no -DINPUT_eglfs=no \
            -DINPUT_glib=no -DINPUT_dbus=no \
            -DINPUT_harfbuzz=no -DINPUT_fontconfig=no \
            -DINPUT_libpng=qt -DINPUT_libjpeg=qt \
            -DINPUT_optimize_size=yes -DINPUT_strip=yes
          ninja -C qt6-host-build -j"$JOBS"
          ninja -C qt6-host-build install

      - name: 编译 Qt6 target (首次约 2h, 缓存命中则跳过)
        if: steps.qt6-cache.outputs.cache-hit != 'true'
        run: ./qt6/build-qt6.sh

      - name: 编译 carmeter
        run: ./qt6/build-carmeter.sh

      - name: 编译 kernel (zImage + dtb)
        run: |
          make -C kernel ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j4 zImage dtbs

      - name: 编译 uboot
        run: |
          # U-Boot 要求 defconfig 和 make 同一次调用 (defconfig 生成 config.mk)
          # 必须显式给 all 目标, 否则只跑完 defconfig 不 build
          make -C uboot ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- mx6ull_fire_mmc_defconfig all -j4

      - name: 收集产物
        run: |
          mkdir -p artifacts
          cp kernel/arch/arm/boot/zImage artifacts/
          cp kernel/arch/arm/boot/dts/imx6ull-carmeter-pro.dtb artifacts/
          cp uboot/u-boot.imx artifacts/u-boot-mmc.imx
          cp staging/usr/bin/carmeter artifacts/
          file artifacts/*

      - uses: actions/upload-artifact@v4
        with:
          name: imx6ull-carmeter-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
